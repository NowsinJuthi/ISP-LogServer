name: logserver

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-logserver}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./api
    restart: unless-stopped
    network_mode: host
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && exec node dist/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      PORT: "4000"
      SYSLOG_UDP_PORT: "514"
      TRUST_PROXY: "true"
      LOG_FILE_DIR: /var/lib/logserver/logs
      WEB_CONFIG_DIR: /var/lib/logserver/web-config
      LOG_TZ: Asia/Dhaka
      TZ: Asia/Dhaka
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-logserver}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6379"
    volumes:
      - ./data/logs:/var/lib/logserver/logs
      - ./data/web-config:/var/lib/logserver/web-config
      - /etc/hostname:/run/host-hostname:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_PROXY_URL: http://host.docker.internal:4000
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_PROXY_URL: http://host.docker.internal:4000
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONF:-logserver.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certbot:/var/www/certbot:ro
      - ./deploy/nginx/certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
